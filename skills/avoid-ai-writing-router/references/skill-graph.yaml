version: 1
canonical_authority: avoid-ai-writing
entrypoint: avoid-ai-writing-router
nodes:
  avoid-ai-writing:
    role: canonical_rulebook
    implicit: false
  avoid-ai-writing-router:
    role: orchestrator
    implicit: true
  ai-writing-detector:
    role: detect_only
    implicit: true
  voice-preserving-rewriter:
    role: rewrite
    implicit: true
  file-edit-in-place:
    role: file_mutation
    implicit: true
  preservation-verifier:
    role: verification
    implicit: true
  false-positive-reviewer:
    role: interpretation_guardrail
    implicit: true
edges:
  - from: avoid-ai-writing-router
    to: ai-writing-detector
    when: detect_or_audit_only
  - from: avoid-ai-writing-router
    to: voice-preserving-rewriter
    when: rewrite_text
  - from: avoid-ai-writing-router
    to: file-edit-in-place
    when: mutate_named_file
  - from: avoid-ai-writing-router
    to: preservation-verifier
    when: compare_before_after
  - from: avoid-ai-writing-router
    to: false-positive-reviewer
    when: consequential_authorship_interpretation
  - from: ai-writing-detector
    to: false-positive-reviewer
    when: user_asks_what_flags_prove
  - from: voice-preserving-rewriter
    to: preservation-verifier
    when: original_and_rewrite_available
  - from: file-edit-in-place
    to: preservation-verifier
    when: before_snapshot_available
  - from: preservation-verifier
    to: voice-preserving-rewriter
    when: user_requests_repair
fallback:
  skill: avoid-ai-writing
  reason: canonical rulebook owns any unmatched editorial edge case
