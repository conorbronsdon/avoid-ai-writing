name: tmp-issue82-sync-validate

on:
  push:
    branches:
      - fix/issue-82-emotional-flatline-evidence

permissions:
  contents: write

jobs:
  sync-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-82-emotional-flatline-evidence
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Regenerate synchronized copies
        run: |
          bash scripts/sync-plugin-skill.sh
          bash scripts/sync-cursor-rules.sh

      - name: Validate
        run: |
          npm test
          npm run self-scan:check

      - name: Commit generated copies
        run: |
          if git diff --quiet; then
            echo "No generated drift."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SKILL.full.md dist cursor-rules plugins skills
          git commit -m "chore: sync emotional-flatline review fixes"
          git push origin HEAD:fix/issue-82-emotional-flatline-evidence
